[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-vending"
version = "0.1.0"
description = "NexoVending business product for vending operations. Consumes nexo-platform as an external dependency."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nexo-platform==1.0.0",
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "testcontainers[postgresql]>=4.10,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexo_vending*"]
exclude = ["tests*", "docs*", "migrations*"]

[tool.setuptools.package-data]
nexo_vending = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-m 'not e2e and not packaging'"
markers = [
    "e2e: runtime gate using Docker Compose; not part of the default pass",
    "packaging: build and clean-install checks for the nexo-vending distribution",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dist", "build", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["nexo_vending", "tests"]
