name: CI

on:
  push:
  pull_request:

env:
  PIP_FIND_LINKS: vendor

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve NexoPlatform repository
        id: platform
        shell: bash
        run: |
          repo="${{ vars.NEXO_PLATFORM_REPOSITORY }}"
          if [ -z "$repo" ]; then
            repo="${{ github.repository_owner }}/NexoPlatform"
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout NexoPlatform
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.platform.outputs.repository }}
          path: _nexo_platform
          token: ${{ secrets.NEXO_PLATFORM_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor nexo-platform wheel
        run: python scripts/vendor_platform.py --platform-root _nexo_platform

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest (unit + architecture + integration)
        run: pytest -q

      - name: Build wheel
        run: python -m build

      - name: Clean-install packaging test
        run: pytest tests/packaging -q -m packaging

  docker-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Resolve NexoPlatform repository
        id: platform
        shell: bash
        run: |
          repo="${{ vars.NEXO_PLATFORM_REPOSITORY }}"
          if [ -z "$repo" ]; then
            repo="${{ github.repository_owner }}/NexoPlatform"
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout NexoPlatform
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.platform.outputs.repository }}
          path: _nexo_platform
          token: ${{ secrets.NEXO_PLATFORM_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor nexo-platform wheel
        run: python scripts/vendor_platform.py --platform-root _nexo_platform

      - name: Docker Compose smoke
        run: pytest tests/e2e -q -m e2e
